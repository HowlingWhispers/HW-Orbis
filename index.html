<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081226" />
    <meta name="description" content="Orbis, the Library of Howling Whispers" />
    <title>Orbis | The Library of Howling Whispers</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('coda.theme');
          const preference = stored === 'dark' || stored === 'light' || stored === 'auto' ? stored : 'auto';
          const theme = preference === 'auto'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : preference;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#081226' : '#f1eadf');
        } catch {
          document.documentElement.dataset.themePreference = 'auto';
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
