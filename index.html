<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081226" />
    <link rel="canonical" href="https://lib.thehowlingwhispers.com/" />
    <meta name="description" content="Orbis is the Library of Howling Whispers — a worldbuilding and character archive with NovelAI integration for AI roleplay, character simulation, and interactive fiction. Browse worlds, characters, places, and more." />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="keywords" content="Orbis, Howling Whispers, NovelAI integration, AI roleplay, AI character simulation, worldbuilding, interactive fiction, character archive, AI storytelling" />
    <title>Orbis | The Library of Howling Whispers — NovelAI-Integrated Worldbuilding & Character Archive</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lib.thehowlingwhispers.com/" />
    <meta property="og:title" content="Orbis | The Library of Howling Whispers" />
    <meta property="og:description" content="A worldbuilding and character archive with NovelAI integration for AI roleplay, character simulation, and interactive fiction. Browse worlds, characters, places, and more." />
    <meta property="og:image" content="https://lib.thehowlingwhispers.com/assets/orbis-banner.webp" />
    <meta property="og:site_name" content="Orbis" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://lib.thehowlingwhispers.com/" />
    <meta name="twitter:title" content="Orbis | The Library of Howling Whispers" />
    <meta name="twitter:description" content="A worldbuilding and character archive with NovelAI integration for AI roleplay, character simulation, and interactive fiction." />
    <meta name="twitter:image" content="https://lib.thehowlingwhispers.com/assets/orbis-banner.webp" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Orbis",
      "alternateName": "The Library of Howling Whispers",
      "url": "https://lib.thehowlingwhispers.com/",
      "description": "A worldbuilding and character archive with NovelAI integration for AI roleplay, character simulation, and interactive fiction.",
      "publisher": {
        "@type": "Organization",
        "name": "Howling Whispers",
        "url": "https://thehowlingwhispers.com/"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://lib.thehowlingwhispers.com/all?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <script>
      (() => {
        try {
          const stored = localStorage.getItem('coda.theme');
          const preference = stored === 'dark' || stored === 'light' || stored === 'auto' ? stored : 'auto';
          const theme = preference === 'auto'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : preference;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#081226' : '#f1eadf');
        } catch {
          document.documentElement.dataset.themePreference = 'auto';
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <script type="module" crossorigin src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
